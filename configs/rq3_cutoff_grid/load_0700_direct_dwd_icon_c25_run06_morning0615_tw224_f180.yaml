kind: load_forecast_model
config:
  repo_root: .
  target_tz: Europe/Berlin
  country_code_entsoe: DE_LU
  entsoe_api_key_env: ENTSOE_API_KEY
  entsoe_start_date: "2025-08-01"
  entsoe_end_date: "2026-07-31"
  actual_load_file: data/processed/load_forecast/actual_load.csv
  entsoe_load_forecast_file: data/processed/load_forecast/entsoe_load_forecast.csv
  export_dir: results/load_forecast_results/rq3_cutoff_grid/load_0700_direct_dwd_icon_c25_run06_morning0615_tw224_f180

  load_target_mode: actual_load
  include_entsoe_forecast_features: false
  include_entsoe_error_lag_features: false
  include_entsoe_error_rolling_features: false

  include_calendar_features: true
  include_holiday_features: true
  include_bridge_day_features: true
  include_actual_load_lag_features: true
  include_partial_load_features: true
  partial_load_reference_day: 1
  partial_load_comparison_lag_days: 7
  partial_load_morning_end_hour: 6
  partial_load_morning_end_minute: 15

  include_weather_features: true
  weather_source: dwd_icon
  icon_dir: data/processed/icon_aggregated_c25_run06
  start_folder_date: "2025-10-25"
  required_run: "06"
  dwd_folder_offset_date: "2025-10-26"
  skip_dates: ["2025-10-26", "2025-10-27", "2025-10-28"]

  include_rich_temperature_features: true
  weather_hdd_thresholds: [12, 15, 18]
  weather_cdd_thresholds: [20, 22, 24]
  include_weighted_weather_features: true
  include_weighted_weather_daily_features: true
  include_weighted_weather_quantile_features: true
  weighted_weather_quantile_feature_bases: [solar_global, t2m_C, hdd12, hdd18, cdd22, cdd24, wind_speed_10m, vmax10m]
  weighted_weather_quantiles: [0.1, 0.25, 0.5, 0.75, 0.9]
  weighted_weather_daily_feature_bases: [t2m_C, hdd12, hdd15, hdd18, cdd20, cdd22, cdd24]
  weighted_weather_daily_stats: [mean, min, max, range]
  weighted_weather_daily_lag_days: [1, 7]
  include_weather_time_interactions: true
  weather_cluster_weight_file: data/processed/load_forecast/weather_cluster_population_weights_c25.csv
  weather_cluster_id_column: cluster_id
  weather_cluster_weight_column: weight
  weather_weighted_feature_prefix: weather_weighted
  weather_weighted_feature_bases: [t2m_C, hdd12, hdd15, hdd18, cdd20, cdd22, cdd24, rel_humidity_pct, vpd_hPa, wind_speed_10m, vmax10m, solar_global, precip]
  keep_weather_cluster_features: false
  include_weather_cluster_spread_features: true
  weather_spread_feature_bases: [t2m_C, hdd12, hdd15, hdd18, cdd20, cdd22, cdd24, rel_humidity_pct, vpd_hPa, wind_speed_10m, vmax10m, solar_global, precip, snow_depth]
  weather_spread_stats: [range, std, p10, p90]

  calendar_harmonics: 3
  actual_load_lag_days: [2, 3, 7, 14, 21]
  target_availability_lag_days: 1
  target_availability_cutoff_hour: 6
  target_availability_cutoff_minute: 15

  model_type: lightgbm
  train_days_rolling: 224
  min_train_days: 30
  test_start: "2025-11-23"
  test_end: "2026-07-31"
  lgbm_n_estimators: 900
  lgbm_learning_rate: 0.015
  lgbm_num_leaves: 15
  lgbm_min_child_samples: 80
  lgbm_subsample: 0.9
  lgbm_colsample_bytree: 0.8
  lgbm_reg_lambda: 1.0
  random_state: 42
  max_features: 180
