[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "da-price-forecasting"
version = "0.1.0"
description = "Operational load, renewable generation, and day-ahead price forecasting for DE-LU."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "David Eiglsperger" },
]
dependencies = [
    "pydantic>=2.11,<3",
    "pyyaml>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "requests>=2.32,<3",
    "openpyxl>=3.1,<4",
    "yfinance>=0.2,<0.3",
]

[project.urls]
Repository = "https://github.com/davideig/DA_Price_Forecasting_DE_LU_Fundamental"
Documentation = "https://github.com/davideig/DA_Price_Forecasting_DE_LU_Fundamental/blob/main/docs/user_guide.md"

[project.scripts]
da-price-forecast = "da_price_forecasting.scripts.run:main"
da-price-energy-arena-daily = "da_price_forecasting.scripts.energy_arena_daily:main"
da-price-energy-arena-price-final-daily = "da_price_forecasting.scripts.energy_arena_price_final_daily:main"
da-price-energy-arena-price-cutoff-daily = "da_price_forecasting.scripts.energy_arena_price_cutoff_daily:main"
da-price-energy-arena-load-daily = "da_price_forecasting.scripts.energy_arena_load_daily:main"
da-price-energy-arena-load-daily-with-weather = "da_price_forecasting.scripts.energy_arena_load_daily_with_weather:main"
da-price-energy-arena-renewable-daily = "da_price_forecasting.scripts.energy_arena_renewable_daily:main"
da-price-dwd-icon-daily-update = "da_price_forecasting.scripts.dwd_icon_daily_update:main"
da-price-open-meteo-availability = "da_price_forecasting.scripts.open_meteo_availability:main"
da-price-create-feature-pack = "da_price_forecasting.scripts.create_feature_pack:main"
da-price-check-data-pack = "da_price_forecasting.scripts.check_data_pack:main"
da-price-operational-archive = "da_price_forecasting.scripts.operational_archive:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "live_api: tests that call external APIs and require credentials",
]
