kind: regional_renewable_features
config:
  repo_root: "."
  weather_source: open_meteo
  feature_mode: full
  target_tz: Europe/Berlin

  cluster_file: data/clustering/icon_d2_mastr_solar_tso_c25.csv
  capacity_file: data/raw/renewable_capacity/installed_capacity.csv
  capacity_map_file: data/processed/renewable_proxy/ecmwf_ifs025_hist_mastr_solar_tso_c25_capacity_map.csv
  output_file: data/processed/renewable_proxy/ecmwf_ifs025_hist_mastr_solar_tso_c25_irradiance_features.csv

  open_meteo_weather_file: data/processed/open_meteo/ecmwf_ifs025_hist_mastr_solar_tso_c25_weather.csv
  open_meteo_base_url: https://historical-forecast-api.open-meteo.com/v1/forecast
  open_meteo_api_mode: historical_forecast
  open_meteo_model: ecmwf_ifs025
  open_meteo_start_date: "2025-10-25"
  open_meteo_end_date: "2026-05-28"
  open_meteo_batch_size: 25
  open_meteo_cell_selection: nearest
  open_meteo_force_download: false
  open_meteo_point_selection: centroid
  open_meteo_request_pause_seconds: 5.0
  open_meteo_retry_attempts: 8
  open_meteo_retry_backoff_seconds: 60.0
  open_meteo_hourly_variables:
    - shortwave_radiation
    - direct_radiation
    - temperature_2m
    - cloud_cover
    - cloud_cover_low
    - cloud_cover_mid
    - cloud_cover_high

  solar_region_strategy: state_tso_proxy
  include_ramps: true
