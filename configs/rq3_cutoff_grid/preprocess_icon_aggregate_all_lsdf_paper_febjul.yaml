kind: icon_aggregate
config:
  repo_root: "."
  lsdf_base: /Volumes/iip-projects/energy/climateData/icon_by_Max_Kleinebrahm
  shapefile_path: data/shapefile/ne_10m_admin_0_countries.shp
  buffer_km: 50
  plot_clusters: false
  skip_existing_output: true
  only_day: null
  only_run_hour: null
  start_date: "2025-10-25"

  aggregation_targets:
    - name: load_c25_run06
      only_run_hour: "06"
      output_parent: data/processed/icon_aggregated_c25_run06
      cluster_source: grid
      n_clusters: 25
      cluster_output_file: data/clustering/icon_d2_clustering_c25.parquet
      variables:
        - t_2m
        - td_2m
        - p
        - u_10m
        - v_10m
        - vmax_10m
        - aswdir_s
        - aswdifd_s
        - tot_prec
        - h_snow
        - snow_gsp

    - name: price_c2_run06
      only_run_hour: "06"
      output_parent: data/processed/icon_aggregated_c2_run06
      cluster_source: grid
      n_clusters: 2
      cluster_output_file: data/clustering/icon_d2_clustering_c2_run06.parquet
      variables:
        - t_2m
        - u_10m
        - v_10m
        - aswdir_s
        - aswdifd_s

    - name: solar_tso_c25_run06
      only_run_hour: "06"
      output_parent: data/processed/icon_aggregated_mastr_solar_tso_c25_run06
      cluster_source: mastr_solar_tso
      n_clusters: 25
      capacity_file: data/raw/renewable_capacity/installed_capacity.csv
      capacity_weighted_aggregation: true
      cluster_output_file: data/clustering/icon_d2_mastr_solar_tso_c25.csv
      variables:
        - aswdir_s
        - aswdifd_s
        - t_2m
        - td_2m
        - tot_prec
        - h_snow
        - snow_gsp

    - name: wind_c100_run06
      only_run_hour: "06"
      output_parent: data/processed/icon_aggregated_mastr_wind_c100_run06
      cluster_source: mastr_wind
      n_clusters: 100
      capacity_file: data/raw/renewable_capacity/installed_capacity.csv
      capacity_weighted_aggregation: true
      cluster_output_file: data/clustering/icon_d2_mastr_wind_c100.csv
      variables:
        - t_2m
        - td_2m
        - p
        - u_10m
        - v_10m
        - vmax_10m
        - tot_prec
        - h_snow
        - snow_gsp

    - name: load_c25_run09
